{% extends "base.html" %}
{% block title %}Manage Inventory - InvenGuardCO{% endblock %}
{% block content %}
    <main class="container">
        <header>
            <h2>Manage Inventory</h2>
        </header>
        <a href="/materials/create" role="button">Register New Material</a>
        <div id="materials-table"
            hx-get="/materials/list?page=1"
            hx-trigger="load, materialDeleted from:body">
            Loading materials...
        </div>
        <div id="modal" class="modal" style="display:none;">
            <dialog open>
            <article>
                <header>
                    <h3>Record Movement</h3>
                    <button aria-label="Close" onclick="document.getElementById('modal').style.display='none';" class="close"></button>
                </header>
                <div id="modal-content">
                </div>
            </article>
            </dialog>
        </div>
        <div id="modal_thres" class="modal" style="display:none;">
            <dialog open>
            <article>
                <header>
                    <h3>Update Thresholds</h3>
                    <button aria-label="Close" onclick="document.getElementById('modal_thres').style.display='none';" class="close"></button>
                </header>
                <div id="modal-content-thres">
                </div>
            </article>
            </dialog>
        </div>
        <div id="modal_edit" class="modal" style="display:none;">
            <dialog open>
            <article>
                <header>
                    <h3>Edit Material</h3>
                    <button aria-label="Close" onclick="document.getElementById('modal_edit').style.display='none';" class="close"></button>
                </header>
                <div id="modal-content-edit">
                </div>
            </article>
            </dialog>
        </div>
    </main>
{% endblock %}
