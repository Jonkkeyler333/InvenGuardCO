{% if error %}
    <div class="error-message" style="color: red; margin-bottom: 10px;">
    ⚠️ {{ error }}
    </div>
{% endif %}
{% if success %}
    <div class="success-message" style="color: green; margin-bottom: 10px;">
        ✅ {{ success }}
    </div>
{% endif %} 
<form id="edit-material-form"
    hx-post="/materials/{{ material.id }}/edit"
    hx-target="#modal-content-edit"
    hx-swap="innerHTML"
>
    <div>
        <label for="sku">SKU:</label>
        <input type="text" id="sku" name="sku" value="{{ material.sku }}" readonly>
        <label for="name">Material Name:</label>
        <input type="text" id="name" name="name" value="{{ material.name }}">
        <div class="grid">
                <div>
                    <label for="unit_measure">Unit of Measure</label>
                    <select id="unit_measure" name="unit_measure" required>
                        <option value="" disabled {% if not material.unit_measure %}selected{% endif %}>Select unit...</option>
                        <option value="tons" {% if material.unit_measure == 'tons' %}selected{% endif %}>tons (t)</option>
                        <option value="kg" {% if material.unit_measure == 'kg' %}selected{% endif %}>Kilograms (kg)</option>
                        <option value="gr" {% if material.unit_measure == 'gr' %}selected{% endif %}>Grams (g)</option>
                        <option value="lb" {% if material.unit_measure == 'lb' %}selected{% endif %}>Pounds (lb)</option>
                        <option value="m" {% if material.unit_measure == 'm' %}selected{% endif %}>Meters (m)</option>
                        <option value="ft" {% if material.unit_measure == 'ft' %}selected{% endif %}>Feet (ft)</option>
                        <option value="unit" {% if material.unit_measure == 'unit' %}selected{% endif %}>Units</option>
                        <option value="box" {% if material.unit_measure == 'box' %}selected{% endif %}>Boxes</option>
                        <option value="liter" {% if material.unit_measure == 'liter' %}selected{% endif %}>Liters</option>
                        <option value="gallon" {% if material.unit_measure == 'gallon' %}selected{% endif %}>Gallons</option>
                    </select>
                </div>
        </div>
        <label for="image_url">Image URL:</label>
        <input type="text" id="image_url" name="image_url" value="{{ material.image_url }}">
    </div>
    <div>
        <button type="submit">Save Changes</button>
        <button type="button" onclick="document.getElementById('modal_edit').style.display='none';htmx.ajax('GET', '/materials/list?page=1', {target: '#materials-table', swap: 'outerHTML'});">Back</button>
    </div>

</form>
